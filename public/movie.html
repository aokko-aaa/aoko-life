<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>40秒でわかる HITO IRO｜あれこれサポート</title>
<meta name="description" content="頭の中の「あれこれ」を、一緒にカタチに。HITO IRO（ヒトイロ）の紹介動画です。">
<!-- LINEやSNSでリンクを貼ったときに出るカード -->
<meta property="og:type" content="website">
<meta property="og:title" content="40秒でわかる HITO IRO">
<meta property="og:description" content="頭の中の「あれこれ」を、一緒にカタチに。">
<meta property="og:url" content="https://life.aokoworks.workers.dev/movie.html">
<meta property="og:image" content="https://life.aokoworks.workers.dev/movie-og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 色はトップページ（index.html）と同じ */
  :root{
    --ink:#333333;
    --paper:#fff;
    --line:#dcdcdc;
    --soft:#f4f4f4;
    --accent:#b4ff3f;   /* 黄緑：文字には使わず、帯や線だけ */
    --brand:#7b4fa0;    /* 紫：ボタン・強調 */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans JP',sans-serif;
    background:var(--soft);
    color:var(--ink);
    -webkit-text-size-adjust:100%;
  }
  /* 1画面に収まる縦型：動画の高さを画面に合わせ、幅は9:16で決める */
  main{
    height:100%;
    display:flex;flex-direction:column;align-items:center;
    gap:14px;
    padding:12px max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main > *{width:min(100%, calc((100dvh - 132px) * 9 / 16));}
  .stage{
    position:relative;aspect-ratio:9/16;flex:none;
    border-radius:16px;overflow:hidden;background:var(--paper);
    box-shadow:0 8px 24px rgba(0,0,0,.08);
  }
  video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:var(--paper);}
  [hidden]{display:none !important;}
  /* 動画の中のQRカード（1080×1920でx193–886, y1009–1375）に重ねる押せる場所 */
  .hot{position:absolute;left:17.8%;top:52.5%;width:64.3%;height:19.2%;border-radius:12px;outline:3px solid transparent;transition:outline-color .2s,background-color .2s;}
  .hot:hover,.hot:focus-visible{outline-color:var(--brand);background-color:rgba(123,79,160,.06);}
  /* 動画の文字にかぶらないよう、URLより下の余白に置く */
  .tap{position:absolute;left:50%;top:84%;transform:translateX(-50%);white-space:nowrap;text-decoration:none;font-size:12px;font-weight:700;color:var(--paper);background:var(--brand);padding:5px 12px;border-radius:999px;animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{50%{transform:translate(-50%,-3px);}}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25);border:0;cursor:pointer;}
  .play span{width:72px;height:72px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(180,255,63,.65);}
  .play svg{width:26px;height:26px;margin-left:4px;fill:var(--paper);}
  .replay{position:absolute;right:10px;top:10px;font:700 12px 'Noto Sans JP',sans-serif;color:var(--ink);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;}
  .btns{display:flex;flex-direction:column;gap:10px;}
  .btn{
    display:flex;align-items:center;justify-content:center;
    min-height:48px;padding:10px 20px;
    background:var(--brand);color:var(--paper);
    font-weight:700;font-size:15px;letter-spacing:.08em;text-decoration:none;
    border-radius:999px;box-shadow:0 5px 0 var(--accent);
  }
  .top-link{text-align:center;font-size:13px;}
  .top-link a{color:var(--brand);}
  .btn:focus-visible,.top-link a:focus-visible,.replay:focus-visible,.play:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}
  /* スマホでは動画を横幅いっぱいに */
  @media (max-width:500px){
    main{padding-left:0;padding-right:0;padding-top:0;}
    .stage{border-radius:0;box-shadow:none;}
    main > .btns, main > .top-link{width:calc(100% - 32px);}
  }
  @media (prefers-reduced-motion: reduce){.tap{animation:none;}}
</style>
</head>
<body>
<main>
  <div class="stage">
    <video id="v" src="hitoiro-promo.mp4" poster="movie-poster.jpg" playsinline muted preload="auto" aria-label="HITO IROの紹介動画"></video>
    <button class="play" id="play" type="button" aria-label="動画を再生"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l15 8-15 8z"/></svg></span></button>
    <a class="hot" id="hot" href="https://forms.gle/UdpYn5shPJjUKRza7" target="_blank" rel="noopener" aria-label="お問い合わせフォームを開く" hidden></a>
    <a class="tap" id="tap" href="https://forms.gle/UdpYn5shPJjUKRza7" target="_blank" rel="noopener" hidden>上のカードをタップしてお問い合わせ</a>
    <button class="replay" id="replay" type="button" hidden>もう一度見る</button>
  </div>
  <div class="btns">
    <a class="btn" href="https://forms.gle/UdpYn5shPJjUKRza7" target="_blank" rel="noopener">お問い合わせはこちらから</a>
  </div>
  <p class="top-link"><a href="./">サービスの詳しい内容を見る</a></p>
</main>
<script>
  (function(){
    var v = document.getElementById('v');
    var play = document.getElementById('play');
    var hot = document.getElementById('hot');
    var tap = document.getElementById('tap');
    var replay = document.getElementById('replay');
    var LINK_FROM = 37; // 最後のQRカードが出てくる秒数（動画を作り直したら合わせて直す）
    // ボタン類の表示は、動画の状態からまとめて決める
    var render = function(){
      var atEnd = v.ended || (v.duration && v.currentTime >= v.duration - 0.1);
      hot.hidden = !(v.currentTime >= LINK_FROM || atEnd);
      tap.hidden = hot.hidden;
      replay.hidden = !atEnd;
      play.hidden = !(v.paused && !atEnd && v.currentTime < LINK_FROM);
    };
    var start = function(){
      var p = v.play();
      if (p && p.catch) p.catch(render);
    };
    play.addEventListener('click', start);
    replay.addEventListener('click', function(){ v.currentTime = 0; start(); });
    ['play','playing','pause','ended','timeupdate','seeked','loadedmetadata'].forEach(function(ev){ v.addEventListener(ev, render); });
    // 音のない動画なので、開いたらそのまま自動再生する
    start();
  })();
</script>
</body>
</html>
